name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MIRA_MODE: mock
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.2"
          enable-cache: true
          cache-dependency-glob: services/engines/uv.lock

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.6"
          terraform_wrapper: false

      - name: System libraries for MediaPipe (face framing)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgles2

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          (cd services/engines && uv sync --frozen)
          pnpm --filter @mira/web exec playwright install --with-deps chromium

      - name: JSON Schema export is current
        run: pnpm --filter @mira/schemas exec tsx scripts/export-json-schema.ts --check

      - name: Python models and contract samples are current
        run: |
          pnpm --filter @mira/schemas exec tsx scripts/export-contract-samples.ts --check
          (cd services/engines && uv run --frozen python tools/generate_models.py --check)

      - name: Terraform format and validate
        run: |
          terraform -chdir=infra fmt -check -recursive
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate

      - name: Check
        run: pnpm check

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
