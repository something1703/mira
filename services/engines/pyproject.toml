[project]
name = "mira-engines"
version = "0.1.0"
description = "MIRA measurement engines: colour, ΔE2000, shade, look, garment, audit, statistics, phantom."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.2",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "colour-science==0.4.7",
  "pillow==13.0.0",
  "mediapipe==1.2.0",
  "httpx==0.28.1",
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "hypothesis==6.170.14",
  "ruff==0.17.3",
  "mypy==2.4.1",
  "datamodel-code-generator==0.35.0",
  "jsonschema==4.26.0",
  "types-jsonschema==4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mira_engines"]

[tool.ruff]
line-length = 100
extend-exclude = ["mira_engines/models/generated"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "NPY", "PT"]
# Measurement units and symbols used on purpose in strings and docstrings.
allowed-confusables = ["×", "ρ", "°", "−"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["mira_engines", "tests"]
plugins = ["pydantic.mypy"]
# Generated by tools/generate_models.py from the JSON Schema; the contract test covers it.
exclude = ["mira_engines/models/generated/"]

[[tool.mypy.overrides]]
module = ["colour.*", "mediapipe.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  # FastAPI's TestClient still imports httpx; harmless in tests.
  "ignore::DeprecationWarning:fastapi.testclient",
  "ignore:Using `httpx`:DeprecationWarning",
]
