openapi: 3.0.0
info:
  title: AI Watermark Removal
  description: >
    # Overview

    AI-Powered Watermark Removal


    Reliably detect and erase watermarks, logos, and other marks while
    preserving the image's original quality and details.

        > Use the tool responsibly to avoid unethical applications, such as removing watermarks for unauthorized commercial use. Respect the intended purpose of the image and adhere to fair use principles.

    ![](https://d32qvgpd29lguw.cloudfront.net/Watermark_Remover_BA_Image_24bf9f2ed1.png)


    ---


    ## Integration Guide


    * AI Watermark Removal Usage Guide


    This guide explains how to upload images, prepare reference outfits, and
    create virtual try-on tasks using the AI Watermark Removal.


    ***

       * Step 1. Upload a File Using the File API

    Use the **File API** (`/s2s/v2.0/file`) to upload a target image.


    ***

       * Step 2. Retrieve File API Response

    The response includes:


    *   `file_id` for creating an AI task.

    *   `requests.url` for uploading the actual image file.


    ***

       * Step 3. Upload Image to Provided URL

    Use the `requests.url` from the File API response to upload the image:


    ***

       * Step 4. Create an AI Task

    Use the **AI Task API** (`/s2s/v2.0/task/wmk-removal`) to create an AI task.


    ***

       * Step 5. Poll for Task Result

    Use the task ID to check the status:


    ```bash

    curl --request GET \
      --url https://yce-api-01.makeupar.com/s2s/v2.0/task/wmk-removal/<YOUR_TASK_ID> \
      --header 'Authorization: Bearer YOUR_API_KEY' \
      --header 'content-type: application/json'
    ```


    ***

       * Step 6. Retrieve Result

    A successful response includes a download URL for the result image:


    ```json

    {
      "status": 200,
      "data": {
        "error": null,
        "results": {
     "url": "https://yce-us.s3-accelerate.amazonaws.com/demo/ttl30/...signature..."
        },
        "task_status": "success"
      }
    }

    ```


    Invalid API Key error response:


    ```json

    {
      "status": 401,
      "error": "Unauthorized",
      "error_code": "InvalidAccessToken"
    }

    ```


    ---


    Use cases:

    ![](https://d32qvgpd29lguw.cloudfront.net/Watermark_Remover_BA_2_c8bbf561af.png)




    ## File Specs & Errors

    * Supported Formats & Dimensions


    |Type|Supported Dimensions|Supported File Size|Supported Formats|

    |  ---- | ---- | ---- | ---- |

    | AI Watermark Removal | max side 4096 px | < 10MB | jpg/png |

        > Removing watermarks can be illegal if done without the copyright owner’s consent or for unauthorized purposes. Always ensure you have proper rights to the image.

    * Error Codes


    | Error code | Description |

    | ---------- | ----------- |

    | invalid_parameter |The parameter(s) is missing or invalid. |

    | error_download_image | The image could not be downloaded. |

    | exceed_max_filesize | The image is too large. The file size must not
    exceed 10 MB. The long side must not exceed 4096 pixels. |

    | error_below_min_image_size | The image is too small. The long side must be
    at least 128 pixels. |

    | error_nsfw_content_detected | Potential NSFW content was detected in the
    result image. |

    | error_editing_failed | The editing process failed because the result image
    is too similar to the source image. |

    | unknown_internal_error | Something went wrong on our end while processing
    this request. |



    * Environment & Dependency


    | Sample Code Language / Tool | Recommended Runtime Versions |

    |---|---|

    | cURL | - bash >= 3.2</br>   - curl >= 7.58 (modern TLS/HTTP
    support)</br>   - jq >= 1.6 (robust JSON parsing) |

    | Node.js (JavaScript) | Node >= 18 (for global fetch) |

    | JavaScript | - Chrome / Edge >= 80</br>   - Firefox >= 74</br>   - Safari
    >= 13.1 |

    | PHP | PHP >= 7.4 (for modern TLS/compat), ext-curl (recommended) or
    allow_url_fopen=On + ext-openssl, ext-json |

    | Python | Python >= 3.10 (for f-strings), requests >= 2.20.0 |

    | Java | Java 11+ (for HttpClient), Jackson Databind >= 2.12.0 |


    ---


    ## Unit Consumption


    | AI Feature | Unit Consumed |

    |---|---|

    | AI Watermark Removal | 1 |


    ---
  version: ""
  termsOfService: https://www.makeupar.com/perfectbeauty/youcam/terms-of-service-api
  contact:
    email: YouCamOnlineEditor_API@perfectcorp.com
  license:
    name: Privacy policy
    url: https://www.makeupar.com/perfectbeauty/youcam/privacy-policy-api
servers:
  - url: https://yce-api-01.makeupar.com
tags:
  - name: V1.0
    description: >-
      Utilize AI-driven technology to detect and remove watermarks from images
      while preserving visual quality.
paths:
  /s2s/v2.0/task/wmk-removal:
    post:
      summary: Run an AI Watermark Removal task.
      description: >
        AI tasks are asynchronous. Prefer webhook-based completion handling when
        the feature supports webhooks. Configure your webhook endpoint, verify
        webhook signatures, and use the received `task_id` to query the task
        result after a `success` or `error` notification. See the [webhook
        integration guide](../develop/webhook.md) for setup and verification
        details.


        If webhooks are not supported or cannot be used in your integration,
        implement polling. After submitting an AI task, poll the status endpoint
        at regular intervals (e.g., every 10 seconds) until the task status is
        `success` or `error`.
      tags:
        - V1.0
      security:
        - BearerAuthenticationV2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/BasicRunTaskV2"
      responses:
        "200":
          description: Successful execution of the task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicRunTaskResponseV2"
        "400":
          description: Failed execution of task
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RunError"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /s2s/v2.0/task/wmk-removal/{task_id}:
    get:
      summary: Check the status of a AI Watermark Removal task.
      x-display-name: AI Watermark Removal
      x-engine-version: V1.0
      tags:
        - V1.0
      security:
        - BearerAuthenticationV2: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            example: grH0CvsgXuAIHLUzD0V1Ol34hoet3R1tvdbtiVHrDb6_UqCLKIejAIajwxrhOAfe
          description: ID of task to check
      responses:
        "200":
          description: Successful check of the task status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusResponseV2"
        "400":
          $ref: "#/components/responses/InvalidTaskId"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "500":
          $ref: "#/components/responses/TaskTimeout"
components:
  securitySchemes:
    BearerAuthenticationV2:
      type: http
      scheme: bearer
      description: >-
        Use the standard 'Bearer authentication'. Put your 'API Key' in header:
        `Authorization:Bearer YOUR_API_KEY`. Notice that there is ' ' a space
        between 'Bearer' and the 'YOUR_API_KEY'.
  schemas:
    BasicRunTaskV2SrcFileUrl:
      type: object
      required:
        - src_file_url
      properties:
        src_file_url:
          type: string
          description: Url of the file to run task. The url should be publicly accessible.
          example: https://example.com/selfie.jpg
    BasicRunTaskV2SrcFileId:
      type: object
      required:
        - src_file_id
      properties:
        src_file_id:
          type: string
          description: ID of file to run task. File ID from upload file API.
          example: pfNK5PuRe0MrwLHcGA3DOmB1ahwfXTbYHjv+KoBIxbE=
    BasicRunTaskV2:
      title: BasicRunTaskV2
      anyOf:
        - title: Run task with src file url
          allOf:
            - $ref: "#/components/schemas/BasicRunTaskV2SrcFileUrl"
        - title: Run task with src file ID
          allOf:
            - $ref: "#/components/schemas/BasicRunTaskV2SrcFileId"
    BasicRunTaskResponseV2:
      type: object
      properties:
        status:
          type: integer
          description: Response status
          example: 200
        data:
          type: object
          properties:
            task_id:
              type: string
              description: >-
                ID of this task. Task result is valid to query by this ID for 24
                hours.
              example: grH0CvsgXuAIHLUzD0V1Ol34hoet3R1tvdbtiVHrDb6_UqCLKIejAIajwxrhOAfe
    RunError:
      type: object
      properties:
        status:
          type: integer
          description: Response status
          example: 400
        error:
          type: string
          description: Error message
          example: The operation could not be completed
        error_code:
          type: string
          enum:
            - InvalidParameters
            - CreditInsufficiency
            - InvalidStyleGroup
            - InvalidStyle
            - BadRequest
          description: |
            Error code:
              * InvalidParameters - Invalid request parameters
              * CreditInsufficiency - Insufficient unit to run
              * BadRequest - Unexpected request parameter
              * InvalidStyleGroup - Invalid style group id
              * InvalidStyle - Invalid style id
    EngineErrorCode:
      type: string
      nullable: true
      enum:
        - error_exceed_max_image_size
        - exceed_max_filesize
        - invalid_parameter
        - error_download_image
        - error_download_mask
        - error_decode_image
        - error_decode_mask
        - error_nsfw_content_detected
        - error_no_face
        - error_pose
        - error_face_parsing
        - error_inference
        - exceed_nsfw_retry_limits
        - error_upload
        - unknown_internal_error
      description: >
        Errors:

        - \`error_exceed_max_image_size\`  - Input image size exceeds the
        maximum limit

        - \`exceed_max_filesize\` - Input file size exceeds the maximum limit

        - \`invalid_parameter\` - Invalid parameter value

        - \`error_download_image\` - Download source image error

        - \`error_download_mask\` - Download mask image error

        - \`error_decode_image\` - Decode source image error

        - \`error_decode_mask\` - Decode mask image error

        - \`error_nsfw_content_detected\` - NSFW content detected in source
        image

        - \`error_no_face\` - No face detected on source image

        - \`error_pose\` - Failed to detect pose on source image

        - \`error_face_parsing\` - Failed to do face segmentation on source
        image

        - \`error_inference\` - Inference pipeline error

        - \`exceed_nsfw_retry_limits\` - Exceed the retry limits to avoid
        generated NSFW image

        - \`error_upload\` - Upload result image error

        - \`unknown_internal_error\` - Others
    TaskStatusResponseBodySingleUrlResultsV2:
      type: object
      properties:
        url:
          type: string
          description: URL to download this result. Valid for 2 hours
          example: https://example.com/sample-result-url
    TaskStatusResponseV2:
      type: object
      properties:
        status:
          type: integer
          description: Response status
          example: 200
        data:
          type: object
          properties:
            task_status:
              type: string
              enum:
                - running
                - success
                - error
              description: Status of this task
            error:
              $ref: "#/components/schemas/EngineErrorCode"
            error_message:
              type: string
              description: Detailed description of error
            results: null
      $ref: "#/components/schemas/TaskStatusResponseBodySingleUrlResultsV2"
  responses:
    InvalidApiKey:
      description: Invalid or missing API key
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
                description: Response status
              error:
                type: string
                example: Invalid API key
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 429
                description: Response status
              error:
                type: string
                example: Too many requests
    InvalidTaskId:
      description: Invalid task ID
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
                description: Response status
              error:
                type: string
                example: Invalid task ID
    TaskTimeout:
      description: Task execution timeout
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 500
                description: Response status
              error:
                type: string
                example: Task execution timed out
