paths:
  /s2s/v2.0/task/body-reshape/pre-process:
    post:
      summary: Run an AI Body Reshape detection task.
      description: >
        Use the pre-process task when the source image may contain more than one
        valid target, or when your integration needs to explicitly choose which
        detected target receives the effect. For single-target images,
        pre-process can be skipped when the feature supports a default `index`
        value and your application does not need manual target selection.


        The pre-process task detects candidate targets in the source image and
        returns their coordinates in `data.results.result`. Each item in the
        result array represents one detected target. Review the returned
        coordinates, map them to the intended face or region in the source
        image, and use that item's zero-based array index as the `index` value
        when creating the effect task.


        For images with multiple detected faces or regions, do not rely on the
        default `index` value without checking the pre-process result. The
        effect is applied only to the target selected by `index`, so the
        integration must confirm the result item that corresponds to the
        intended target before running the effect task.


        This task is asynchronous. After creating the task, handle completion
        with webhook if the feature supports it, or poll the corresponding
        pre-process status endpoint until `data.task_status` is `success` or
        `error`.
      tags:
        - V1.0
      security:
        - BearerAuthenticationV2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BasicRunTaskV2'
      responses:
        '200':
          description: Successful execution of the task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicRunTaskResponseV2'
        '400':
          description: Failed execution of task
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RunError'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /s2s/v2.0/task/body-reshape/pre-process/{task_id}:
    get:
      summary: Check the status of a AI Body Reshape detection task.
      tags:
        - V1.0
      security:
        - BearerAuthenticationV2: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            example: grH0CvsgXuAIHLUzD0V1Ol34hoet3R1tvdbtiVHrDb6_UqCLKIejAIajwxrhOAfe
          description: ID of task to check
      responses:
        '200':
          description: Successful check of the task status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TaskStatusResponsePreProcessNoUrlBase'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          results:
                            type: object
                            properties:
                              timed:
                                type: number
                              result:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    left:
                                      type: number
                                    top:
                                      type: number
                                    width:
                                      type: number
                                    height:
                                      type: number
        '400':
          $ref: '#/components/responses/InvalidTaskId'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '500':
          $ref: '#/components/responses/TaskTimeout'
  /s2s/v2.0/task/body-reshape:
    post:
      summary: Run an AI Body Reshape task.
      description: >
        AI tasks are asynchronous. Prefer webhook-based completion handling when
        the feature supports webhooks. Configure your webhook endpoint, verify
        webhook signatures, and use the received `task_id` to query the task
        result after a `success` or `error` notification. See the [webhook
        integration guide](../develop/webhook.md) for setup and verification
        details.


        If webhooks are not supported or cannot be used in your integration,
        implement polling. After submitting an AI task, poll the status endpoint
        at regular intervals (e.g., every 10 seconds) until the task status is
        `success` or `error`.
      tags:
        - V1.0
      security:
        - BearerAuthenticationV2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BasicRunTaskV2'
                - type: object
                  required:
                    - version
                    - features
                  properties:
                    version:
                      type: string
                      description: >
                        Version of the features specification. Defaults to
                        `"1.0"` unless otherwise specified.
                      default: '1.0'
                      example: '1.0'
                    index:
                      type: integer
                      example: 0
                      description: The index of the person from detection task result.
                    features:
                      type: object
                      description: Cannot be all zero
                      minProperties: 1
                      properties:
                        arm:
                          type: number
                          minimum: -100
                          maximum: 100
                          example: 0
                        breast:
                          type: number
                          minimum: -100
                          maximum: 100
                          example: 0
                          description: >-
                            Applies to both sides. A per-side key (`breast_left`
                            / `breast_right`) overrides this value for that
                            side; a per-side `0` means that side is left
                            unchanged.
                        breast_left:
                          type: number
                          minimum: -100
                          maximum: 100
                          example: 0
                        breast_right:
                          type: number
                          minimum: -100
                          maximum: 100
                          example: 0
                        hip:
                          type: number
                          minimum: -100
                          maximum: 100
                          example: 0
                        hip_lift:
                          type: number
                          minimum: -100
                          maximum: 100
                          example: 0
                        leg:
                          type: number
                          minimum: -100
                          maximum: 100
                          example: 0
                        neck:
                          type: number
                          minimum: 0
                          maximum: 100
                          example: 0
                          description: >-
                            Applies to both sides. A per-side key (`neck_left` /
                            `neck_right`) overrides this value for that side; a
                            per-side `0` means that side is left unchanged.
                        neck_left:
                          type: number
                          minimum: 0
                          maximum: 100
                          example: 0
                        neck_right:
                          type: number
                          minimum: 0
                          maximum: 100
                          example: 0
                        shoulder:
                          type: number
                          minimum: -100
                          maximum: 100
                          example: 0
                          description: >-
                            Applies to both sides. A per-side key
                            (`shoulder_left` / `shoulder_right`) overrides this
                            value for that side; a per-side `0` means that side
                            is left unchanged.
                        shoulder_left:
                          type: number
                          minimum: -100
                          maximum: 100
                          example: 0
                        shoulder_right:
                          type: number
                          minimum: -100
                          maximum: 100
                          example: 0
                        squared_shoulder:
                          type: number
                          minimum: -100
                          maximum: 100
                          example: 0
                          description: >-
                            Applies to both sides. A per-side key
                            (`squared_shoulder_left` / `squared_shoulder_right`)
                            overrides this value for that side; a per-side `0`
                            means that side is left unchanged.
                        squared_shoulder_left:
                          type: number
                          minimum: -100
                          maximum: 100
                          example: 0
                        squared_shoulder_right:
                          type: number
                          minimum: -100
                          maximum: 100
                          example: 0
                        slim:
                          type: number
                          minimum: -100
                          maximum: 100
                          example: 0
                        taller:
                          type: number
                          minimum: 0
                          maximum: 100
                          example: 0
                        waist:
                          type: number
                          minimum: -100
                          maximum: 100
                          example: 0
                        belly:
                          type: number
                          minimum: -100
                          maximum: 100
                          example: 0
      responses:
        '200':
          description: Successful execution of the task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicRunTaskResponseV2'
        '400':
          description: Failed execution of task
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RunError'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /s2s/v2.0/task/body-reshape/{task_id}:
    get:
      summary: Check the status of a AI Body Reshape task.
      tags:
        - V1.0
      security:
        - BearerAuthenticationV2: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            example: grH0CvsgXuAIHLUzD0V1Ol34hoet3R1tvdbtiVHrDb6_UqCLKIejAIajwxrhOAfe
          description: ID of task to check
      responses:
        '200':
          description: Successful check of the task status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TaskStatusResponseV2'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          results:
                            type: object
                            properties:
                              timed:
                                type: number
                              timed_apply:
                                type: number
                              arm:
                                type: boolean
                              breast_left:
                                type: boolean
                              breast_right:
                                type: boolean
                              hip:
                                type: boolean
                              hip_lift:
                                type: boolean
                              leg:
                                type: boolean
                              neck_left:
                                type: boolean
                              neck_right:
                                type: boolean
                              shoulder_left:
                                type: boolean
                              shoulder_right:
                                type: boolean
                              squared_shoulder_left:
                                type: boolean
                              squared_shoulder_right:
                                type: boolean
                              slim:
                                type: boolean
                              taller:
                                type: boolean
                              waist:
                                type: boolean
                              belly:
                                type: boolean
        '400':
          $ref: '#/components/responses/InvalidTaskId'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '500':
          $ref: '#/components/responses/TaskTimeout'
components:
  securitySchemes:
    BearerAuthenticationV2:
      type: http
      scheme: bearer
      description: >-
        Use the standard 'Bearer authentication'. Put your 'API Key' in header:
        `Authorization:Bearer YOUR_API_KEY`. Notice that there is ' ' a space
        between 'Bearer' and the 'YOUR_API_KEY'.
  schemas:
    BasicRunTaskV2SrcFileUrl:
      type: object
      required:
        - src_file_url
      properties:
        src_file_url:
          type: string
          description: Url of the file to run task. The url should be publicly accessible.
          example: https://example.com/selfie.jpg
    BasicRunTaskV2SrcFileId:
      type: object
      required:
        - src_file_id
      properties:
        src_file_id:
          type: string
          description: ID of file to run task. File ID from upload file API.
          example: pfNK5PuRe0MrwLHcGA3DOmB1ahwfXTbYHjv+KoBIxbE=
    BasicRunTaskV2:
      title: BasicRunTaskV2
      anyOf:
        - title: Run task with src file url
          allOf:
            - $ref: '#/components/schemas/BasicRunTaskV2SrcFileUrl'
        - title: Run task with src file ID
          allOf:
            - $ref: '#/components/schemas/BasicRunTaskV2SrcFileId'
    BasicRunTaskResponseV2:
      type: object
      properties:
        status:
          type: integer
          description: Response status
          example: 200
        data:
          type: object
          properties:
            task_id:
              type: string
              description: >-
                ID of this task. Task result is valid to query by this ID for 24
                hours.
              example: grH0CvsgXuAIHLUzD0V1Ol34hoet3R1tvdbtiVHrDb6_UqCLKIejAIajwxrhOAfe
    RunError:
      type: object
      properties:
        status:
          type: integer
          description: Response status
          example: 400
        error:
          type: string
          description: Error message
          example: The operation could not be completed
        error_code:
          type: string
          enum:
            - InvalidParameters
            - CreditInsufficiency
            - InvalidStyleGroup
            - InvalidStyle
            - BadRequest
          description: |
            Error code:
              * InvalidParameters - Invalid request parameters
              * CreditInsufficiency - Insufficient unit to run
              * BadRequest - Unexpected request parameter
              * InvalidStyleGroup - Invalid style group id
              * InvalidStyle - Invalid style id
    EngineErrorCode:
      type: string
      nullable: true
      enum:
        - error_exceed_max_image_size
        - exceed_max_filesize
        - invalid_parameter
        - error_download_image
        - error_download_mask
        - error_decode_image
        - error_decode_mask
        - error_nsfw_content_detected
        - error_no_face
        - error_pose
        - error_face_parsing
        - error_inference
        - exceed_nsfw_retry_limits
        - error_upload
        - unknown_internal_error
      description: >
        Errors:

        - \`error_exceed_max_image_size\`  - Input image size exceeds the
        maximum limit

        - \`exceed_max_filesize\` - Input file size exceeds the maximum limit

        - \`invalid_parameter\` - Invalid parameter value

        - \`error_download_image\` - Download source image error

        - \`error_download_mask\` - Download mask image error

        - \`error_decode_image\` - Decode source image error

        - \`error_decode_mask\` - Decode mask image error

        - \`error_nsfw_content_detected\` - NSFW content detected in source
        image

        - \`error_no_face\` - No face detected on source image

        - \`error_pose\` - Failed to detect pose on source image

        - \`error_face_parsing\` - Failed to do face segmentation on source
        image

        - \`error_inference\` - Inference pipeline error

        - \`exceed_nsfw_retry_limits\` - Exceed the retry limits to avoid
        generated NSFW image

        - \`error_upload\` - Upload result image error

        - \`unknown_internal_error\` - Others
    TaskStatusResponsePreProcessNoUrlBase:
      type: object
      properties:
        status:
          type: integer
          description: Response status
          example: 200
        data:
          type: object
          properties:
            task_status:
              type: string
              enum:
                - running
                - success
                - error
              description: Status of this task
            error:
              $ref: '#/components/schemas/EngineErrorCode'
            error_message:
              type: string
              description: Detailed description of error
    TaskStatusResponseBodySingleUrlResultsV2:
      type: object
      properties:
        url:
          type: string
          description: URL to download this result. Valid for 2 hours
          example: https://example.com/sample-result-url
    TaskStatusResponseV2:
      type: object
      properties:
        status:
          type: integer
          description: Response status
          example: 200
        data:
          type: object
          properties:
            task_status:
              type: string
              enum:
                - running
                - success
                - error
              description: Status of this task
            error:
              $ref: '#/components/schemas/EngineErrorCode'
            error_message:
              type: string
              description: Detailed description of error
            results: null
      $ref: '#/components/schemas/TaskStatusResponseBodySingleUrlResultsV2'
  responses:
    InvalidApiKey:
      description: Invalid or missing API key
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
                description: Response status
