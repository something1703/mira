  version: ''
  termsOfService: https://www.makeupar.com/perfectbeauty/youcam/terms-of-service-api
  contact:
    email: YouCamOnlineEditor_API@perfectcorp.com
  license:
    name: Privacy policy
    url: https://www.makeupar.com/perfectbeauty/youcam/privacy-policy-api
servers:
  - url: https://yce-api-01.makeupar.com
paths:
  /s2s/v2.0/task/face-reshape/pre-process:
    post:
      summary: Run an AI Face Reshape detection task.
      description: >
        Use the pre-process task when the source image may contain more than one
        valid target, or when your integration needs to explicitly choose which
        detected target receives the effect. For single-target images,
        pre-process can be skipped when the feature supports a default `index`
        value and your application does not need manual target selection.


        The pre-process task detects candidate targets in the source image and
        returns their coordinates in `data.results.result`. Each item in the
        result array represents one detected target. Review the returned
        coordinates, map them to the intended face or region in the source
        image, and use that item's zero-based array index as the `index` value
        when creating the effect task.


        For images with multiple detected faces or regions, do not rely on the
        default `index` value without checking the pre-process result. The
        effect is applied only to the target selected by `index`, so the
        integration must confirm the result item that corresponds to the
        intended target before running the effect task.


        This task is asynchronous. After creating the task, handle completion
        with webhook if the feature supports it, or poll the corresponding
        pre-process status endpoint until `data.task_status` is `success` or
        `error`.
      tags:
        - V1.0
      security:
        - BearerAuthenticationV2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BasicRunTaskV2'
      responses:
        '200':
          description: Successful execution of the task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicRunTaskResponseV2'
        '400':
          description: Failed execution of task
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RunError'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /s2s/v2.0/task/face-reshape/pre-process/{task_id}:
    get:
      summary: Check the status of an AI Face Reshape detection task.
      description: >
        Use the pre-process task when the source image may contain more than one
        valid target, or when your integration needs to explicitly choose which
        detected target receives the effect. For single-target images,
        pre-process can be skipped when the feature supports a default `index`
        value and your application does not need manual target selection.


        The pre-process task detects candidate targets in the source image and
        returns their coordinates in `data.results.result`. Each item in the
        result array represents one detected target. Review the returned
        coordinates, map them to the intended face or region in the source
        image, and use that item's zero-based array index as the `index` value
        when creating the effect task.


        For images with multiple detected faces or regions, do not rely on the
        default `index` value without checking the pre-process result. The
        effect is applied only to the target selected by `index`, so the
        integration must confirm the result item that corresponds to the
        intended target before running the effect task.


        This task is asynchronous. After creating the task, handle completion
        with webhook if the feature supports it, or poll the corresponding
        pre-process status endpoint until `data.task_status` is `success` or
        `error`.
      tags:
        - V1.0
      security:
        - BearerAuthenticationV2: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            example: grH0CvsgXuAIHLUzD0V1Ol34hoet3R1tvdbtiVHrDb6_UqCLKIejAIajwxrhOAfe
          description: ID of task to check
      responses:
        '200':
          description: Successful check of the task status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TaskStatusResponsePreProcessNoUrlBase'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          results:
                            type: object
                            properties:
                              timed:
                                type: number
                              result:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    left:
                                      type: number
                                    top:
                                      type: number
                                    width:
                                      type: number
                                    height:
                                      type: number
        '400':
          $ref: '#/components/responses/InvalidTaskId'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '500':
          $ref: '#/components/responses/TaskTimeout'
  /s2s/v2.0/task/face-reshape:
    post:
      summary: Run an AI Face Reshape task.
      description: >
        AI tasks are asynchronous. Prefer webhook-based completion handling when
        the feature supports webhooks. Configure your webhook endpoint, verify
        webhook signatures, and use the received `task_id` to query the task
        result after a `success` or `error` notification. See the [webhook
        integration guide](../develop/webhook.md) for setup and verification
        details.


        If webhooks are not supported or cannot be used in your integration,
        implement polling. After submitting an AI task, poll the status endpoint
        at regular intervals (e.g., every 10 seconds) until the task status is
        `success` or `error`.
      tags:
        - V1.0
      security:
        - BearerAuthenticationV2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/BasicRunTaskV2'
                - type: object
                  required:
                    - version
                    - features
                    - global
                  properties:
                    version:
                      type: string
                      description: >
                        Version of the features specification. Defaults to
                        `"1.0"` unless otherwise specified.
                      default: '1.0'
                      example: '1.0'
                    index:
                      type: integer
                      example: 0
                      default: 0
                      description: >-
                        Zero-based index of the target object to apply the
                        effect to. For multi-objects images, run the pre-process
                        task first, inspect the object coordinates in
                        `data.results.result`, and pass the index of the
                        selected object here.


                        The pre-processing step analyzes the input image to
                        identify all detectable objects before any effect is
                        applied. It runs a detection task that returns
                        structured data for each object, including a list of
                        bounding box coordinates. The position of each entry in
                        this list serves as its zero-based index, which is then
                        used to specify the target object for the effect.


                        This information is returned in a structured format,
                        commonly under `data.results.result`.

                        By running this step first, you can:
                            * Understand how many objects are present in the image
                            * Inspect their positions and sizes
                            * Select the correct target object by its index

                        Always run the pre-processing step for images with
                        multiple objects.

                        Review `data.results.result` to identify objects and
                        their indices.

                        Use the corresponding zero-based index to select the
                        correct target.
                    features:
                      type: object
                      description: Cannot be all zero
                      minProperties: 1
                      allOf:
                        - $ref: '#/components/schemas/FaceReshapeFaceFeature'
                        - $ref: '#/components/schemas/FaceReshapeEyeFeature'
                        - $ref: '#/components/schemas/FaceReshapeNoseFeature'
                        - $ref: '#/components/schemas/FaceReshapeLipFeature'
                    global:
                      type: object
                      description: Skin smooth setup
                      properties:
                        skin_smooth_strength:
                          type: integer
                          minimum: 0
                          maximum: 100
                          example: 50
                        skin_smooth_color_intensity:
                          type: integer
                          minimum: 0
                          maximum: 100
                          example: 50
      responses:
        '200':
          description: Successful execution of the task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicRunTaskResponseV2'
        '400':
          description: Failed execution of task
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RunError'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /s2s/v2.0/task/face-reshape/{task_id}:
    get:
      summary: Check the status of a AI Face Reshape task.
      tags:
        - V1.0
      security:
        - BearerAuthenticationV2: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            example: grH0CvsgXuAIHLUzD0V1Ol34hoet3R1tvdbtiVHrDb6_UqCLKIejAIajwxrhOAfe
          description: ID of task to check
      responses:
        '200':
          description: Successful check of the task status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TaskStatusResponseV2'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          results:
                            type: object
                            properties:
                              timed:
                                type: number
                              timed_apply:
                                type: number
        '400':
          $ref: '#/components/responses/InvalidTaskId'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '500':
          $ref: '#/components/responses/TaskTimeout'
components:
  securitySchemes:
    BearerAuthenticationV2:
      type: http
      scheme: bearer
      description: >-
        Use the standard 'Bearer authentication'. Put your 'API Key' in header:
        `Authorization:Bearer YOUR_API_KEY`. Notice that there is ' ' a space
        between 'Bearer' and the 'YOUR_API_KEY'.
  schemas:
    FaceReshapeFaceFeature:
      type: object
      properties:
        cheekbones:
          type: integer
          minimum: 0
          maximum: 100
        jaw:
          type: integer
          minimum: 0
          maximum: 100
        face_reshape:
          type: integer
          minimum: -100
          maximum: 100
          description: >-
            Applies to both sides of the face. A per-side key
            (`face_reshape_left` / `face_reshape_right`) overrides this value
            for that side; a per-side `0` means that side is left unchanged.
        face_reshape_left:
          type: integer
          minimum: -100
          maximum: 100
        face_reshape_right:
          type: integer
          minimum: -100
          maximum: 100
        face_width:
          type: integer
          minimum: -100
          maximum: 100
        chin_reshape:
          type: integer
          minimum: -100
          maximum: 100
          description: >-
            Applies to both sides of the chin. A per-side key
            (`chin_reshape_left` / `chin_reshape_right`) overrides this value
            for that side; a per-side `0` means that side is left unchanged.
        chin_reshape_left:
          type: integer
          minimum: -100
          maximum: 100
        chin_reshape_right:
          type: integer
          minimum: -100
          maximum: 100
        chin_length:
          type: integer
          minimum: -100
          maximum: 100
      example:
        cheekbones: 0
        jaw: 0
        face_reshape: 0
        face_reshape_left: 0
        face_reshape_right: 0
        face_width: 0
        chin_reshape: 0
        chin_reshape_left: 0
        chin_reshape_right: 0
        chin_length: 0
    FaceReshapeEyeFeature:
      type: object
      properties:
        eye_size:
          type: integer
          minimum: -100
          maximum: 100
          description: >-
            Applies to both eyes. A per-side key (`eye_size_left` /
            `eye_size_right`) overrides this value for that side; a per-side `0`
            means that side is left unchanged.
        eye_size_left:
          type: integer
          minimum: -100
          maximum: 100
        eye_size_right:
          type: integer
          minimum: -100
          maximum: 100
        eye_distance:
          type: integer
          minimum: -100
          maximum: 100
        eye_angle:
          type: integer
          minimum: -100
          maximum: 100
        eye_height:
          type: integer
          minimum: -100
          maximum: 100
        eye_width:
          type: integer
          minimum: -100
          maximum: 100
      example:
        eye_size: 0
        eye_size_left: 0
        eye_size_right: 0
        eye_distance: 0
        eye_angle: 0
        eye_height: 0
        eye_width: 0
    FaceReshapeNoseFeature:
      type: object
      properties:
        nose_bridge_width:
          type: integer
          minimum: -100
          maximum: 100
        nose_lift:
          type: integer
          minimum: -100
          maximum: 100
        nose_size:
          type: integer
          minimum: -100
          maximum: 100
        nose_tip:
          type: integer
          minimum: -100
          maximum: 100
        nose_tip_width:
          type: integer
          minimum: -100
          maximum: 100
        nose_wing:
          type: integer
          minimum: -100
          maximum: 100
      example:
        nose_bridge_width: 0
        nose_lift: 0
        nose_size: 0
        nose_tip: 0
        nose_tip_width: 0
        nose_wing: 0
    FaceReshapeLipFeature:
      type: object
      properties:
        lip_size:
          type: integer
          minimum: -100
          maximum: 100
        lip_width:
          type: integer
          minimum: -100
          maximum: 100
        lip_peak:
          type: integer
          minimum: -100
          maximum: 100
        lip_height_top:
          type: integer
          minimum: -100
          maximum: 100
        lip_height_bottom:
          type: integer
          minimum: -100
          maximum: 100
      example:
        lip_size: 0
        lip_width: 0
        lip_peak: 0
        lip_height_top: 0
        lip_height_bottom: 0
    BasicRunTaskV2SrcFileUrl:
      type: object
      required:
        - src_file_url
      properties:
        src_file_url:
          type: string
          description: Url of the file to run task. The url should be publicly accessible.
          example: https://example.com/selfie.jpg
    BasicRunTaskV2SrcFileId:
      type: object
      required:
        - src_file_id
      properties:
        src_file_id:
          type: string
          description: ID of file to run task. File ID from upload file API.
          example: pfNK5PuRe0MrwLHcGA3DOmB1ahwfXTbYHjv+KoBIxbE=
    BasicRunTaskV2:
      title: BasicRunTaskV2
      anyOf:
        - title: Run task with src file url
          allOf:
            - $ref: '#/components/schemas/BasicRunTaskV2SrcFileUrl'
        - title: Run task with src file ID
          allOf:
            - $ref: '#/components/schemas/BasicRunTaskV2SrcFileId'
    BasicRunTaskResponseV2:
      type: object
      properties:
        status:
          type: integer
          description: Response status
          example: 200
        data:
          type: object
          properties:
            task_id:
              type: string
              description: >-
                ID of this task. Task result is valid to query by this ID for 24
                hours.
              example: grH0CvsgXuAIHLUzD0V1Ol34hoet3R1tvdbtiVHrDb6_UqCLKIejAIajwxrhOAfe
    RunError:
      type: object
      properties:
        status:
          type: integer
          description: Response status
          example: 400
        error:
          type: string
          description: Error message
          example: The operation could not be completed
        error_code:
          type: string
          enum:
            - InvalidParameters
            - CreditInsufficiency
            - InvalidStyleGroup
            - InvalidStyle
            - BadRequest
          description: |
            Error code:
              * InvalidParameters - Invalid request parameters
              * CreditInsufficiency - Insufficient unit to run
              * BadRequest - Unexpected request parameter
              * InvalidStyleGroup - Invalid style group id
              * InvalidStyle - Invalid style id
    EngineErrorCode:
      type: string
      nullable: true
      enum:
        - error_exceed_max_image_size
        - exceed_max_filesize
        - invalid_parameter
        - error_download_image
        - error_download_mask
        - error_decode_image
        - error_decode_mask
        - error_nsfw_content_detected
        - error_no_face
        - error_pose
        - error_face_parsing
        - error_inference
        - exceed_nsfw_retry_limits
        - error_upload
        - unknown_internal_error
      description: >
        Errors:

        - \`error_exceed_max_image_size\`  - Input image size exceeds the
        maximum limit

        - \`exceed_max_filesize\` - Input file size exceeds the maximum limit

        - \`invalid_parameter\` - Invalid parameter value

        - \`error_download_image\` - Download source image error

        - \`error_download_mask\` - Download mask image error

        - \`error_decode_image\` - Decode source image error

        - \`error_decode_mask\` - Decode mask image error

        - \`error_nsfw_content_detected\` - NSFW content detected in source
        image

        - \`error_no_face\` - No face detected on source image

        - \`error_pose\` - Failed to detect pose on source image

        - \`error_face_parsing\` - Failed to do face segmentation on source
        image

        - \`error_inference\` - Inference pipeline error

        - \`exceed_nsfw_retry_limits\` - Exceed the retry limits to avoid
        generated NSFW image

        - \`error_upload\` - Upload result image error

        - \`unknown_internal_error\` - Others
    TaskStatusResponsePreProcessNoUrlBase:
      type: object
      properties:
        status:
          type: integer
          description: Response status
          example: 200
        data:
          type: object
          properties:
            task_status:
              type: string
              enum:
                - running
                - success
                - error
              description: Status of this task
            error:
              $ref: '#/components/schemas/EngineErrorCode'
            error_message:
              type: string
              description: Detailed description of error
    TaskStatusResponseBodySingleUrlResultsV2:
      type: object
      properties:
        url:
          type: string
          description: URL to download this result. Valid for 2 hours
          example: https://example.com/sample-result-url
    TaskStatusResponseV2:
      type: object
      properties:
        status:
          type: integer
          description: Response status
          example: 200
        data:
          type: object
          properties:
            task_status:
              type: string
              enum:
                - running
                - success
                - error
              description: Status of this task
            error:
