    |---|---|

    | AI Necklace Virtual Try-On V1.0 | 1 Unit for Single-item wear |


    ---
  version: ''
  termsOfService: https://www.makeupar.com/perfectbeauty/youcam/terms-of-service-api
  contact:
    email: YouCamOnlineEditor_API@perfectcorp.com
  license:
    name: Privacy policy
    url: https://www.makeupar.com/perfectbeauty/youcam/privacy-policy-api
servers:
  - url: https://yce-api-01.makeupar.com
tags:
  - name: V1.0
    description: >-
      Generate virtual try-on experiences for necklaces from uploaded images
      using AI processing, supporting alignment and shadow parameters.
paths:
  /s2s/v2.0/task/2d-vto/necklace:
    post:
      summary: Run an AI 2D Virtual Try On Necklace task.
      description: >
        This endpoint initiates the necklace virtual try-on process. You must
        provide source file(s) and reference image(s) (via URL or File ID),
        along with specific parameters for alignment, shadowing, and wearing
        location. The task will be processed asynchronously, and you can check
        its status using the task_id returned in this response.
      tags:
        - V1.0
      security:
        - BearerAuthenticationV2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NecklaceRunTaskV2'
      responses:
        '200':
          description: Successful execution of the task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicRunTaskResponseV2'
        '400':
          description: Failed execution of task
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RunError'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /s2s/v2.0/task/2d-vto/necklace/{task_id}:
    get:
      summary: Check the status of a AI 2D Virtual Try On Necklace task.
      tags:
        - V1.0
      security:
        - BearerAuthenticationV2: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            example: grH0CvsgXuAIHLUzD0V1Ol34hoet3R1tvdbtiVHrDb6_UqCLKIejAIajwxrhOAfe
          description: ID of task to check
      responses:
        '200':
          description: Successful check of the task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskStatusResponseV2'
        '400':
          $ref: '#/components/responses/InvalidTaskId'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '500':
          $ref: '#/components/responses/TaskTimeout'
components:
  securitySchemes:
    BearerAuthenticationV2:
      type: http
      scheme: bearer
      description: >-
        Use the standard 'Bearer authentication'. Put your 'API Key' in header:
        `Authorization:Bearer YOUR_API_KEY`. Notice that there is ' ' a space
        between 'Bearer' and the 'YOUR_API_KEY'.
  schemas:
    NecklaceRunTaskV2:
      allOf:
        - anyOf:
            - allOf:
                - title: Run task with src file url & srcmsk file url & ref file urls
                - $ref: '#/components/schemas/BasicRunTaskV2SrcFileUrl'
                - $ref: '#/components/schemas/2dVtoRunTaskV2SrcmskFileUrl'
                - $ref: '#/components/schemas/2dVtoRunTaskV2RefFileUrls'
            - allOf:
                - title: Run task with src file url & srcmsk file url & ref file IDs
                - $ref: '#/components/schemas/BasicRunTaskV2SrcFileUrl'
                - $ref: '#/components/schemas/2dVtoRunTaskV2SrcmskFileUrl'
                - $ref: '#/components/schemas/2dVtoRunTaskV2RefFileIds'
            - allOf:
                - title: Run task with src file ID & srcmsk file ID & ref file urls
                - $ref: '#/components/schemas/BasicRunTaskV2SrcFileId'
                - $ref: '#/components/schemas/2dVtoRunTaskV2SrcmskFileId'
                - $ref: '#/components/schemas/2dVtoRunTaskV2RefFileUrls'
            - allOf:
                - title: Run task with src file ID & srcmsk file ID & ref file IDs
                - $ref: '#/components/schemas/BasicRunTaskV2SrcFileId'
                - $ref: '#/components/schemas/2dVtoRunTaskV2SrcmskFileId'
                - $ref: '#/components/schemas/2dVtoRunTaskV2RefFileIds'
        - $ref: '#/components/schemas/2dVtoRunTaskV2SrcInfo'
        - type: object
          required:
            - object_infos
          properties:
            object_infos:
              type: array
              items:
                type: object
                required:
                  - name
                properties:
                  name:
                    type: string
                    description: >-
                      The reference url or File ID. Indicate which reference
                      product image should be matched.
                    example: https://example.com/vto_sku.jpg
                  parameter:
                    type: object
                    description: Contain several object informations in this list.
                    properties:
                      necklace_need_remove_background:
                        type: boolean
                        description: Whether the necklace image needs background removal.
                        default: true
                        example: true
                      necklace_anchor_point:
                        type: array
                        description: >-
                          The anchor points of the necklace image, used for
                          alignment. <br>Type: 2x2 list of integers <br>Range:
                          [[x, y], [x, y]] (pixel coordinates) <br>Default: null
                          (use engine default)
                        default: null
                        example: null
                        minItems: 2
                        maxItems: 2
                        items:
                          type: array
                          minItems: 2
                          maxItems: 2
                          items:
                            type: integer
                      necklace_wearing_location:
                        type: array
                        description: >-
                          The target locations of photo where the necklace
                          should be placed. <br>Type: 2x2 list of integers
                          <br>Range: [[x, y], [x, y]] (pixel coordinates)
                          <br>Default: null (use engine default)
                        default: null
                        example: null
                        minItems: 2
                        maxItems: 2
                        items:
                          type: array
                          minItems: 2
                          maxItems: 2
                          items:
                            type: integer
                      necklace_shadow_intensity:
                        type: number
                        description: >-
                          Shadow intensity applied to the necklace (higher =
                          darker shadow).
                        minimum: 0
                        maximum: 1
                        default: 0.5
                        example: 0.5
                      necklace_ambient_light_intensity:
                        type: number
                        description: Ambient light adjustment intensity for the necklace.
                        minimum: 0
                        maximum: 1
                        default: 0.5
                        example: 0.5
    BasicRunTaskV2SrcFileUrl:
      type: object
      required:
        - src_file_url
      properties:
        src_file_url:
          type: string
          description: Url of the file to run task. The url should be publicly accessible.
          example: https://example.com/selfie.jpg
    2dVtoRunTaskV2SrcmskFileUrl:
      type: object
      properties:
        srcmsk_file_url:
          type: string
          description: >-
            Url of the source mask file to run task. The url should be publicly
            accessible.
          example: https://example.com/src_mask.jpg
    2dVtoRunTaskV2RefFileUrls:
      type: object
      required:
        - ref_file_urls
      properties:
        ref_file_urls:
          type: array
          description: >-
            Url of the reference file to run task. The url should be publicly
            accessible.
          example:
            - https://example.com/vto_sku.jpg
          items:
            type: string
    2dVtoRunTaskV2RefFileIds:
      type: object
      required:
        - ref_file_ids
      properties:
        ref_file_ids:
          type: array
          description: >-
            ID of the reference file file to run task. File ID from upload file
            API.
          example:
            - pfNK5PuRe0MrwLHcGA3DOmB1ahwfXTbYHjv+KoBIxbE=
          items:
            type: string
    BasicRunTaskV2SrcFileId:
      type: object
      required:
        - src_file_id
      properties:
        src_file_id:
          type: string
          description: ID of file to run task. File ID from upload file API.
          example: pfNK5PuRe0MrwLHcGA3DOmB1ahwfXTbYHjv+KoBIxbE=
    2dVtoRunTaskV2SrcmskFileId:
      type: object
      properties:
        srcmsk_file_id:
          type: string
          description: >-
            ID of the source mask file to run task. File ID from upload file
            API.
          example: pfNK5PuRe0MrwLHcGA3DOmB1ahwfXTbYHjv+KoBIxbE=
    2dVtoRunTaskV2SrcInfo:
      type: object
      required:
        - source_info
      properties:
        source_info:
          type: object
          description: Contain source photo informations.
          properties:
            name:
              type: string
              description: The source url or File ID.
              example: https://example.com/selfie.jpg
            mask_name:
              type: string
              description: The source mask url or File ID.
              example: https://example.com/src_mask.jpg
          required:
            - name
    BasicRunTaskResponseV2:
      type: object
      properties:
        status:
          type: integer
          description: Response status
          example: 200
        data:
          type: object
          properties:
            task_id:
              type: string
              description: >-
                ID of this task. Task result is valid to query by this ID for 24
                hours.
              example: grH0CvsgXuAIHLUzD0V1Ol34hoet3R1tvdbtiVHrDb6_UqCLKIejAIajwxrhOAfe
    RunError:
      type: object
      properties:
        status:
          type: integer
          description: Response status
          example: 400
        error:
          type: string
          description: Error message
          example: The operation could not be completed
        error_code:
          type: string
          enum:
            - InvalidParameters
            - CreditInsufficiency
            - InvalidStyleGroup
            - InvalidStyle
            - BadRequest
          description: |
            Error code:
              * InvalidParameters - Invalid request parameters
              * CreditInsufficiency - Insufficient unit to run
              * BadRequest - Unexpected request parameter
              * InvalidStyleGroup - Invalid style group id
              * InvalidStyle - Invalid style id
    EngineErrorCode:
      type: string
      nullable: true
      enum:
        - error_exceed_max_image_size
        - exceed_max_filesize
        - invalid_parameter
        - error_download_image
        - error_download_mask
        - error_decode_image
        - error_decode_mask
        - error_nsfw_content_detected
        - error_no_face
        - error_pose
        - error_face_parsing
        - error_inference
        - exceed_nsfw_retry_limits
        - error_upload
        - unknown_internal_error
      description: >
        Errors:

        - \`error_exceed_max_image_size\`  - Input image size exceeds the
        maximum limit

        - \`exceed_max_filesize\` - Input file size exceeds the maximum limit

        - \`invalid_parameter\` - Invalid parameter value

        - \`error_download_image\` - Download source image error

        - \`error_download_mask\` - Download mask image error

        - \`error_decode_image\` - Decode source image error

        - \`error_decode_mask\` - Decode mask image error

        - \`error_nsfw_content_detected\` - NSFW content detected in source
        image

        - \`error_no_face\` - No face detected on source image

        - \`error_pose\` - Failed to detect pose on source image

        - \`error_face_parsing\` - Failed to do face segmentation on source
        image

        - \`error_inference\` - Inference pipeline error

        - \`exceed_nsfw_retry_limits\` - Exceed the retry limits to avoid
        generated NSFW image

        - \`error_upload\` - Upload result image error

        - \`unknown_internal_error\` - Others
    TaskStatusResponseBodySingleUrlResultsV2:
      type: object
      properties:
        url:
          type: string
          description: URL to download this result. Valid for 2 hours
          example: https://example.com/sample-result-url
    TaskStatusResponseV2:
      type: object
      properties:
        status:
          type: integer
          description: Response status
          example: 200
        data:
          type: object
          properties:
            task_status:
              type: string
              enum:
                - running
                - success
                - error
              description: Status of this task
            error:
              $ref: '#/components/schemas/EngineErrorCode'
            error_message:
              type: string
              description: Detailed description of error
            results: null
      $ref: '#/components/schemas/TaskStatusResponseBodySingleUrlResultsV2'
  responses:
    InvalidApiKey:
      description: Invalid or missing API key
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
                description: Response status
              error:
                type: string
                example: Invalid API key
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 429
                description: Response status
              error:
                type: string
                example: Too many requests
    InvalidTaskId:
      description: Invalid task ID
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
                description: Response status
              error:
                type: string
                example: Invalid task ID
    TaskTimeout:
      description: Task execution timeout
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 500
                description: Response status
              error:
                type: string
                example: Task execution timed out
