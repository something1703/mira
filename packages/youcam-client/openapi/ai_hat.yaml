openapi: 3.0.0
info:
  title: AI Hat Virtual Try-On
  description: >
    # Overview

    Step into the future of fashion with our Hyper-Realistic AR Try-On for
    Headwear, powered by cutting-edge AI technology. This innovative solution
    transforms online shopping into an immersive experience, allowing customers
    to virtually try on headwear with unmatched precision and realism.

    From instant style discovery to true-to-life visualization, our AR
    technology ensures every hat and headband looks and feels authentic. Helping
    shoppers find their perfect fit and style before they buy. Elevate
    engagement, boost confidence, and redefine the way customers interact with
    your products.


    ## Integration Guide

    This guide walks you through:


    *   **Endpoint:** `/s2s/v2.0/task/hat`

    *   **Authentication:** All requests require an `Authorization: Bearer
    YOUR_API_KEY`

    *   **Workflow:**
        1.  **Prepare a selfie image:** Uploading an image or providing a valid image URL of yourself as the virtual try-on target.
        1.  **Prepare a hat image:** Upload a hat product image or a photo of a person wearing hat.
        1.  **Select a style and a gender:** Select a preferred style and the gender you wish to visualize.
        1.  **Fire an AI task and Retrieve Task ID:** Capture the `task_id` from the response.
        1.  **Poll Status (`GET`):** Use the `task_id` to check the status of the task. Continue polling until `task_status` is `"success"` or `"error"`.

    ---


    * Authentication

    - Include your API key in the request header using **Bearer Token**:

    ```

    Authorization: Bearer YOUR_API_KEY

    ```

    You can find your API Key at
    https://yce.makeupar.com/api-console/en/api-keys/.


    ---


    * AI Hat API Usage Guide


    This guide explains how to upload images, prepare reference hat, and create
    virtual try-on tasks using the AI Hat API.


    ***

       * Step 1. Prepare a Selfie Image

    You can:

    *   Upload a selfie image using the File API (`/s2s/v2.0/file`), or

    *   Provide a valid image URL.

         * Step 1.1 Upload a File Using the File API

    Use the **File API** (`/s2s/v2.0/file`) to upload a target user image.


    **Image Requirements:**


    *   Upload a selfie photo.

    *   Ensure the photo clearly shows the upper body.

    *   Avoid backgrounds with multiple people or distracting objects.


    **Example Request:**


    ```bash

    curl --request POST \
      --url https://yce-api-01.makeupar.com/s2s/v2.0/file \
      --header 'Authorization: Bearer YOUR_API_KEY' \
      --header 'content-type: application/json' \
      --data '{
        "files": [
          {
            "content_type": "image/jpg",
            "file_name": "selfie_photo_01_3dbd1b6683.jpg",
            "file_size": 547541
          }
        ]
      }'
    ```


    ***

         * Step 1.2. Retrieve File API Response

    The response includes:


    *   `file_id` for creating an AI task.

    *   `requests.url` for uploading the actual image file.


    **Sample Response:**


    ```json

    {
      "status": 200,
      "data": {
        "files": [
          {
            "content_type": "image/jpg",
            "file_name": "selfie_photo_01_3dbd1b6683.jpg",
            "file_id": "SaGaqpDgKwFrVBgMpQMA3HY0LeqdT9/13W5TOD8/u/FfjK3xgCQ+hRt9MJXBFaud",
            "requests": [
              {
                "method": "PUT",
                "url": "https://yce-us.s3-accelerate.amazonaws.com/demo/ttl30/...signature...",
                "headers": {
                  "Content-Length": "547541",
                  "Content-Type": "image/jpg"
                }
              }
            ]
          }
        ]
      }
    }

    ```


    ***

         * Step 1.3. Upload Image to Provided URL

    Use the `requests.url` from the File API response to upload the image:


    ```bash

    curl --location --request PUT
    'https://yce-us.s3-accelerate.amazonaws.com/demo/ttl30/...signature...' \
      --header 'Content-Type: image/jpg' \
      --header 'Content-Length: 547541' \
      --data-binary @'./selfie_photo_01_3dbd1b6683.jpg'
    ```


    ***

       * Step 2. Prepare a Reference Hat Image

    You can:


    *   Upload a hat image using the File API (`/s2s/v2.0/file`), or

    *   Provide a valid image URL.


    **Supported Hat Images:**


    *   A hat product image.

    *   A photo of a person wearing hat.


    Refer to **[File Specs and
    Errors](#section/overview/File-Specs-and-Errors)** for detailed
    specifications.


    ***

       * Step 3. Create an AI Task

    Select a preferred style and the gender you wish to visualize.

    Use the **AI Task API** (`/s2s/v2.0/task/hat`) to create a virtual try-on
    task.


    **Parameters:**


    *   For the user image: `src_file_id` or `src_file_url`.

    *   For the hat image: `ref_file_id`, or `ref_file_url`.


    **Example Request:**


    ```bash

    curl --request POST \
      --url https://yce-api-01.makeupar.com/s2s/v2.0/task/hat \
      --header 'Authorization: Bearer YOUR_API_KEY' \
      --header 'content-type: application/json' \
      --data '{
        "src_file_url": "https://example.com/selfie.jpg",
        "ref_file_url": "https://example.com/accessory.jpg",
        "gender": "female",
        "style": "random"
    }'

    ```


    **Sample Response:**


    ```json

    {
      "status": 200,
      "data": {
        "task_id": "SaGaqpDgKwFrVBgMpQMA3HY0LeqdT9_13W5TOD8_u_GPi6NqQ3dhlmN-6ntFwhzT"
      }
    }

    ```


    ***

       * Step 4. Poll for Task Result

    Use the task ID to check the status:


    ```bash

    curl --request GET \
      --url https://yce-api-01.makeupar.com/s2s/v2.0/task/hat/SaGaqpDgKwFrVBgMpQMA3HY0LeqdT9_13W5TOD8_u_GPi6NqQ3dhlmN-6ntFwhzT \
      --header 'Authorization: Bearer YOUR_API_KEY' \
      --header 'content-type: application/json'
    ```


    ***

       * Step 5. Retrieve Result

    A successful response includes a download URL for the result image:


    ```json

    {
      "status": 200,
      "data": {
        "error": null,
        "results": {
          "url": "https://yce-us.s3-accelerate.amazonaws.com/demo/ttl30/...signature..."
        },
        "task_status": "success"
      }
    }

    ```


    Invalid API Key error response:


    ```json

    {
      "status": 401,
      "error": "Unauthorized",
      "error_code": "InvalidAccessToken"
    }

    ```


    ---


    ## File Specs & Errors


    * AI Hat Virtual Try-On Specification

       * Image Requirements

    | Type   | Minimum Resolution | Notes |

    | ------ | ------------------ | ----- |

    | Selfie | 512 × 512 | Face visible, head-to-chest preferred |

    | Hat  | 512 × 512 (product)<br>800 × 800 (worn) | Clear, unobstructed hat
    view |


    **Supported Hat Image**


    * Product Image Requirements
        * Minimum resolution: 512 × 512 pixels
        * Only one product per image
        * The product should cover more than 25% of the image height

    ![](https://bcw-media.s3.ap-northeast-1.amazonaws.com/strapi/assets/026_thumb_dca334af3c.jpg)


    * Worn Image Requirements
        * Minimum resolution: 800 × 800 pixels
        * Single Item Requirement: The model must wear exactly one item. Multiple items or accessories are not permitted.
        * Coverage Ratio: The worn item must occupy more than 20% of the total image height. This ensures the item is clearly visible and prominent within the frame.

    ![](https://bcw-media.s3.ap-northeast-1.amazonaws.com/strapi/assets/010_thumb_51490eebeb.jpg)


    **Supported Selfie View**


    * Recommended image resolution: at least 512 × 512 pixels.

    * Recommended face coverage: more than 15% of the image height.

    * Single Subject Requirement: The image must contain exactly one human
    subject. No additional people or partial figures are allowed.

    * Face Visibility: The subject's face must be fully visible without
    obstruction. Hair, accessories, or objects should not cover key facial
    features.

    * Framing: The image must include at least a head shot, covering the area
    from the top of the head to the chest. A half-body shot (head to waist) is
    preferred for optimal analysis.


    ![](https://bcw-media.s3.ap-northeast-1.amazonaws.com/strapi/assets/lashana_lynch_thumb_7a900b811e.jpg)


    **Try-on Styles**


    * There are five predefined styles for generating the virtual try-on output:
    "style_sporty_casual" "style_urban_fashion" "style_vacation_casual"
    "style_warm_cozy" and "style_bohemian". You can specify this style parameter
    when creating an AI task or allow the system to select a style at random by
    default.


    ![style_vacation_casual](https://bcw-media.s3.ap-northeast-1.amazonaws.com/strapi/assets/5f42385b_6aef_44cd_b576_2ec10e31305d_824cc2019b.jpg)


    ---


    * Supported Formats & Dimensions


    | AI Feature | Supported Dimensions | Supported File Size | Supported
    Formats |

    |  ----  | ----  | ----  | ----  |

    | AI Hat Virtual Try-On | Input: long side <= 4096 <br>Output: 896 x 1152 |
    < 10MB | jpg/jpeg/png/heic |


    * Error Codes


    | Error Code | Description |

    | ------------------------------ |
    -------------------------------------------- |

    | error\_download\_image         | Failed to download source or reference
    image |

    | error\_inference               | Inference pipeline
    error                     |

    | error\_no\_face                | No face detected in source
    image             |

    | error\_nsfw\_content\_detected | NSFW content detected in
    result              |

    | exceed\_max\_filesize          | File size exceeds 10
    MB                      |

    | invalid\_parameter             | Invalid gender or style
    value                |

    | unknown\_internal\_error       | Other internal
    errors                        |



    * Environment & Dependency


    | Sample Code Language / Tool | Recommended Runtime Versions |

    |---|---|

    | cURL | - bash >= 3.2</br>   - curl >= 7.58 (modern TLS/HTTP
    support)</br>   - jquery >= 1.6 (robust JSON parsing) |

    | Node.js (JavaScript) | Node >= 18 (for global fetch) |

    | JavaScript | - Chrome / Edge >= 80</br>   - Firefox >= 74</br>   - Safari
    >= 13.1 |

    | PHP | PHP >= 7.4 (for modern TLS/compat), ext-curl (recommended) or
    allow_url_fopen=On + ext-openssl, ext-json |

    | Python | Python >= 3.10 (for f-strings), requests >= 2.20.0 |

    | Java | Java 11+ (for HttpClient), Jackson Databind >= 2.12.0 |


    ---


    ## Unit Consumption


    | AI Feature | Unit Consumed |

    |---|---|

    | AI Hat Virtual Try-On V2.0 | 2 |


    ---
  version: ""
  termsOfService: https://www.makeupar.com/perfectbeauty/youcam/terms-of-service-api
  contact:
    email: YouCamOnlineEditor_API@perfectcorp.com
  license:
    name: Privacy policy
    url: https://www.makeupar.com/perfectbeauty/youcam/privacy-policy-api
servers:
  - url: https://yce-api-01.makeupar.com
tags:
  - name: V2.0
    description: >-
      Generate virtual try-on experiences for hats from uploaded images using AI
      processing, supporting gender-specific style parameters.
paths:
  /s2s/v2.0/task/hat:
    post:
      summary: Run an AI Hat task.
      description: >
        This endpoint initiates the hat virtual try-on process. You must provide
        a source file, reference files (URL or ID), specify gender and style
        parameters. The task will be processed asynchronously, and you can check
        its status using the task_id returned in this response.
      tags:
        - V2.0
      security:
        - BearerAuthenticationV2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/GenderRunTaskV2"
                - type: object
                  properties:
                    style:
                      type: string
                      enum:
                        - random
                        - style_sporty_casual
                        - style_urban_fashion
                        - style_vacation_casual
                        - style_warm_cozy
                        - style_bohemian
                      default: random
                      description: To control outfit and background style.
                      example: random
      responses:
        "200":
          description: Successful execution of the task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicRunTaskResponseV2"
        "400":
          description: Failed execution of task
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/RunError"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /s2s/v2.0/task/hat/{task_id}:
    get:
      summary: Check the status of a AI Hat task.
      tags:
        - V2.0
      security:
        - BearerAuthenticationV2: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            example: grH0CvsgXuAIHLUzD0V1Ol34hoet3R1tvdbtiVHrDb6_UqCLKIejAIajwxrhOAfe
          description: ID of task to check
      responses:
        "200":
          description: Successful check of the task status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStatusResponseV2"
        "400":
          $ref: "#/components/responses/InvalidTaskId"
        "401":
          $ref: "#/components/responses/InvalidApiKey"
        "500":
          $ref: "#/components/responses/TaskTimeout"
components:
  securitySchemes:
    BearerAuthenticationV2:
      type: http
      scheme: bearer
      description: >-
        Use the standard 'Bearer authentication'. Put your 'API Key' in header:
        `Authorization:Bearer YOUR_API_KEY`. Notice that there is ' ' a space
        between 'Bearer' and the 'YOUR_API_KEY'.
  schemas:
    BasicRunTaskV2SrcFileUrl:
      type: object
      required:
        - src_file_url
      properties:
        src_file_url:
          type: string
          description: Url of the file to run task. The url should be publicly accessible.
          example: https://example.com/selfie.jpg
    BasicRunTaskV2RefFileUrl:
      type: object
      properties:
        ref_file_url:
          type: string
          description: >-
            Url of the reference file to run task. The url should be publicly
            accessible.
          example: https://example.com/accessory.jpg
    BasicRunTaskV2RefFileId:
      type: object
      properties:
        ref_file_id:
          type: string
          description: ID of the reference file to run task. File ID from upload file API.
          example: pfNK5PuRe0MrwLHcGA3DOmB1ahwfXTbYHjv+KoBIxbE=
    BasicRunTaskV2SrcFileId:
      type: object
      required:
        - src_file_id
      properties:
        src_file_id:
          type: string
          description: ID of file to run task. File ID from upload file API.
          example: pfNK5PuRe0MrwLHcGA3DOmB1ahwfXTbYHjv+KoBIxbE=
    BasicRunTaskV2WithRequiredRef:
      title: BasicRunTaskV2WithRef
      anyOf:
        - allOf:
            - title: Run task with src file url & ref file url
              required:
                - ref_file_url
            - $ref: "#/components/schemas/BasicRunTaskV2SrcFileUrl"
            - $ref: "#/components/schemas/BasicRunTaskV2RefFileUrl"
        - allOf:
            - title: Run task with src file url & ref file ID
              required:
                - ref_file_id
            - $ref: "#/components/schemas/BasicRunTaskV2SrcFileUrl"
            - $ref: "#/components/schemas/BasicRunTaskV2RefFileId"
        - allOf:
            - title: Run task with src file ID & ref file url
              required:
                - ref_file_url
            - $ref: "#/components/schemas/BasicRunTaskV2SrcFileId"
            - $ref: "#/components/schemas/BasicRunTaskV2RefFileUrl"
        - allOf:
            - title: Run task with src file ID & ref file ID
              required:
                - ref_file_id
            - $ref: "#/components/schemas/BasicRunTaskV2SrcFileId"
            - $ref: "#/components/schemas/BasicRunTaskV2RefFileId"
    GenderRunTaskV2:
      allOf:
        - $ref: "#/components/schemas/BasicRunTaskV2WithRequiredRef"
        - type: object
          required:
            - gender
          properties:
            gender:
              type: string
              enum:
                - female
                - male
              description: Gender of the person in the image.
              example: female
    BasicRunTaskResponseV2:
      type: object
      properties:
        status:
          type: integer
          description: Response status
          example: 200
        data:
          type: object
          properties:
            task_id:
              type: string
              description: >-
                ID of this task. Task result is valid to query by this ID for 24
                hours.
              example: grH0CvsgXuAIHLUzD0V1Ol34hoet3R1tvdbtiVHrDb6_UqCLKIejAIajwxrhOAfe
    RunError:
      type: object
      properties:
        status:
          type: integer
          description: Response status
          example: 400
        error:
          type: string
          description: Error message
          example: The operation could not be completed
        error_code:
          type: string
          enum:
            - InvalidParameters
            - CreditInsufficiency
            - InvalidStyleGroup
            - InvalidStyle
            - BadRequest
          description: |
            Error code:
              * InvalidParameters - Invalid request parameters
              * CreditInsufficiency - Insufficient unit to run
              * BadRequest - Unexpected request parameter
              * InvalidStyleGroup - Invalid style group id
              * InvalidStyle - Invalid style id
    EngineErrorCode:
      type: string
      nullable: true
      enum:
        - error_exceed_max_image_size
        - exceed_max_filesize
        - invalid_parameter
        - error_download_image
        - error_download_mask
        - error_decode_image
        - error_decode_mask
        - error_nsfw_content_detected
        - error_no_face
        - error_pose
        - error_face_parsing
        - error_inference
        - exceed_nsfw_retry_limits
        - error_upload
        - unknown_internal_error
      description: >
        Errors:

        - \`error_exceed_max_image_size\`  - Input image size exceeds the
        maximum limit

        - \`exceed_max_filesize\` - Input file size exceeds the maximum limit

        - \`invalid_parameter\` - Invalid parameter value

        - \`error_download_image\` - Download source image error

        - \`error_download_mask\` - Download mask image error

        - \`error_decode_image\` - Decode source image error

        - \`error_decode_mask\` - Decode mask image error

        - \`error_nsfw_content_detected\` - NSFW content detected in source
        image

        - \`error_no_face\` - No face detected on source image

        - \`error_pose\` - Failed to detect pose on source image

        - \`error_face_parsing\` - Failed to do face segmentation on source
        image

        - \`error_inference\` - Inference pipeline error

        - \`exceed_nsfw_retry_limits\` - Exceed the retry limits to avoid
        generated NSFW image

        - \`error_upload\` - Upload result image error

        - \`unknown_internal_error\` - Others
    TaskStatusResponseBodySingleUrlResultsV2:
      type: object
      properties:
        url:
          type: string
          description: URL to download this result. Valid for 2 hours
          example: https://example.com/sample-result-url
    TaskStatusResponseV2:
      type: object
      properties:
        status:
          type: integer
          description: Response status
          example: 200
        data:
          type: object
          properties:
            task_status:
              type: string
              enum:
                - running
                - success
                - error
              description: Status of this task
            error:
              $ref: "#/components/schemas/EngineErrorCode"
            error_message:
              type: string
              description: Detailed description of error
            results: null
      $ref: "#/components/schemas/TaskStatusResponseBodySingleUrlResultsV2"
  responses:
    InvalidApiKey:
      description: Invalid or missing API key
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
                description: Response status
              error:
                type: string
                example: Invalid API key
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 429
                description: Response status
              error:
                type: string
                example: Too many requests
    InvalidTaskId:
      description: Invalid task ID
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
                description: Response status
              error:
                type: string
                example: Invalid task ID
    TaskTimeout:
      description: Task execution timeout
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 500
                description: Response status
              error:
                type: string
                example: Task execution timed out
